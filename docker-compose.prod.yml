services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:15-alpine
    container_name: fullstack_postgres_prod
    environment:
      POSTGRES_DB: ${DB_NAME:-fullstack_app}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - fullstack_prod_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-fullstack_app}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Security: Don't expose database port in production
    # ports:
    #   - "5432:5432"

  # Backend API (Production)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fullstack_backend_prod
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fullstack_app}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-https://yourdomain.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fullstack_prod_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    volumes:
      - ./logs:/app/logs
    # Resource limits for production
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Nginx Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: fullstack_nginx_prod
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/ssl/certs
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - fullstack_prod_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 60s
      timeout: 10s
      retries: 3
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  postgres_prod_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  fullstack_prod_network:
    driver: bridge
    internal: false
