services:
  # Backend API (Production)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fullstack_backend_prod
    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST}   # <-- RDS endpoint
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}
    expose:
      - "3001"
    networks:
      - fullstack_prod_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    volumes:
      - ./logs:/app/logs

  # Nginx Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: fullstack_nginx_prod
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/backend.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/ssl/certs
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - fullstack_prod_network
    restart: unless-stopped

volumes:
  nginx_logs:
    driver: local

networks:
  fullstack_prod_network:
    driver: bridge
