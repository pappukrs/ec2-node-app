services:
  # Next.js Frontend Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fullstack-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-/api}
      - NEXT_PUBLIC_API_TIMEOUT=${NEXT_PUBLIC_API_TIMEOUT:-10000}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-FullStack App}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_TOKEN_REFRESH_THRESHOLD=${NEXT_PUBLIC_TOKEN_REFRESH_THRESHOLD:-300000}
      - NEXT_PUBLIC_MAX_RETRY_ATTEMPTS=${NEXT_PUBLIC_MAX_RETRY_ATTEMPTS:-3}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
